name: CI/CD for Django App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Deploy to EC2
      env:
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_HOST: ${{ secrets.EC2_HOST }}
        DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
      run: |
        # Set up SSH agent and add private key
        eval "$(ssh-agent -s)"  # Start the SSH agent
        echo "$EC2_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        ssh-add private_key.pem

        # Deploy code to EC2
        ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "
        cd $DEPLOY_DIR || exit 1

        # Ensure virtual environment is set up
        if [ ! -d .venv ]; then
          python3 -m venv .venv
        fi
        source .venv/bin/activate

        # Pull latest changes and install dependencies
        git pull origin main || exit 1
        pip install --upgrade pip || exit 1
        pip install -r requirements.txt || exit 1

        # Apply migrations and collect static files
        python manage.py migrate || exit 1
        python manage.py collectstatic --noinput || exit 1

        # Restart services
        sudo systemctl restart gunicorn || exit 1
        sudo systemctl restart nginx || exit 1
        "


